# Corstone-1000 / Cortex-A320 FVP.

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_AUDIOMARK_TENSOR_ARENA_SIZE=2097152

# Keep AudioMark/Speex and Zephyr's CMSIS-DSP library on the Cortex-A Neon path.
CONFIG_CMSIS_DSP_NEON=y

# AudioMark + TFLM is larger than small default mappings on this platform.
CONFIG_KERNEL_VM_SIZE=0x2000000
CONFIG_MAX_XLAT_TABLES=16
